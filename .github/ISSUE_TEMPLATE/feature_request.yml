name: Feature request
description: Suggest an idea for Evelin
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task on your device farm, not just the feature.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Evelin help?
